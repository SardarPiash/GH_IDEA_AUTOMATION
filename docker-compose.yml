services:
  app:
    build: .
    ports:
      - "1111:1111"
    environment:
      PORT: "1111"
      HOSTNAME: "0.0.0.0"
      CHROME_PATH: /usr/bin/chromium
      AUTO_SPLIT_STATE_PATH: /data/auto-split.json
      CODEX_WORKDIR: /app
    volumes:
      - idea-data:/data
      - ./.env.local:/app/.env.local:ro
    restart: unless-stopped

volumes:
  idea-data:
